name = "research-tracker"
main = ".open-next/worker.js"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# OpenAlex API Key（Freemium，每日 $1 免费额度 = ~1000 次搜索）
# 本地开发：从 .env.local 或 .dev.vars 读取（均已 gitignore）
# Cloudflare Pages 生产：在 Dashboard → Settings → Environment Variables 中配置
# 详见 .env.local 和 .dev.vars.example 文件
# [vars]
# OPENALEX_API_KEY = "your-key-here"
